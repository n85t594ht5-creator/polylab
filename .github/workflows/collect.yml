name: POLYLAB collector

on:
  # Накопление выборки: строгий baseline даёт ~1 сигнал на 200+ снимков,
  # поэтому статистика набирается только временем, а не длиной одного прогона.
  schedule:
    - cron: "8 */2 * * *"
  workflow_dispatch:
    inputs:
      run_sec:
        description: "Длительность прогона, сек"
        default: "300"
      sample_sec:
        description: "Интервал снимков, сек"
        default: "15"

permissions:
  contents: write

# защита от параллельных коллекторов на уровне Actions;
# файловый замок в коде закрывает остальные случаи
concurrency:
  group: polylab-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      # raw предыдущего прогона нужен, чтобы дописывать тот же суточный файл
      - name: Day key
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # Суточный raw обязан накапливаться между прогонами. Артефакт именуется по
      # дню: иначе прогон следующих суток затирает предыдущие (это уже случилось —
      # 50 снимков превратились в 45).
      # Восстановление суточного raw обязательно: дозапись в обрубленный файл
      # закрепила бы потерю навсегда. Если артефакт дня есть, а восстановить
      # не удалось — падаем громко, а не продолжаем молча.
      - name: Restore raw of the day (mandatory)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="${{ steps.day.outputs.d }}"
          mkdir -p data/raw/dna
          ART=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.name==\"raw-${DAY}\") | select(.expired==false)] | sort_by(.created_at) | last | .workflow_run.id // empty")
          if [ -z "$ART" ]; then
            echo "артефакта raw-${DAY} нет — это первый прогон суток"
          else
            echo "восстанавливаю raw-${DAY} из прогона $ART"
            gh run download "$ART" -n "raw-${DAY}" -D data/raw --repo "$GITHUB_REPOSITORY" || true
            if [ ! -f "data/raw/dna/${DAY}.csv.gz" ]; then
              echo "::error::артефакт raw-${DAY} существует, но не восстановлен — дозапись потеряла бы данные"
              exit 1
            fi
            echo "восстановлено: $(ls -la data/raw/dna/${DAY}.csv.gz)"
          fi

      # Проверка ДО сбора: raw не должен быть беднее агрегата
      - name: Measure raw AFTER RESTORE
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0,'.')
          from polylab.data.integrity import raw_rows
          import os
          day = os.environ["DAY"]
          n, tr, present = raw_rows(day)
          print(f"::notice::RAW ПОСЛЕ ВОССТАНОВЛЕНИЯ: {n} строк (файл есть: {present}, обрыв: {tr})")
          open("/tmp/raw_after_restore.txt","w").write(str(n))
          PY
        env:
          DAY: ${{ steps.day.outputs.d }}

      - name: Verify raw integrity before collect
        run: python polylab/data/integrity.py before

      - name: Collect
        env:
          RUN_SEC: ${{ github.event.inputs.run_sec || '1500' }}
          SAMPLE_SEC: ${{ github.event.inputs.sample_sec || '15' }}
          ASSETS: BTC,ETH,SOL,XRP
          WINDOWS: "5,15,60"
          SHADOW_ARENA: "1"
          SHADOW_BANKROLL: "1000"
        run: python polylab/data/collector.py

      - name: Measure raw AFTER APPEND
        run: |
          python - <<'PY'
          import sys, os; sys.path.insert(0,'.')
          from polylab.data.integrity import raw_rows
          day = os.environ["DAY"]
          before = int(open("/tmp/raw_after_restore.txt").read() or 0)
          n, tr, _ = raw_rows(day)
          print(f"::notice::RAW ПОСЛЕ ДОЗАПИСИ: {n} строк (было {before}, прирост {n-before})")
          open("/tmp/raw_before_upload.txt","w").write(str(n))
          if n < before:
              print("::error::raw уменьшился в течение прогона")
              raise SystemExit(1)
          PY
        env:
          DAY: ${{ steps.day.outputs.d }}

      - name: Verify raw integrity after collect
        run: python polylab/data/integrity.py after

      - name: Build daily aggregate
        run: |
          python polylab/data/aggregate.py "$(date -u +%Y-%m-%d)"
          python polylab/data/aggregate.py "$(date -u -d yesterday +%Y-%m-%d)" || true

      - name: Publish dashboard data
        run: python polylab/data/publish.py

      - name: Rotate local files
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0,'.')
          from polylab.data.store import Store
          from datetime import datetime, timezone
          print("удалено локально:", Store().rotate(datetime.now(timezone.utc)))
          PY

      # raw НЕ коммитится: замер показал рост .git на 3.2 МБ/сутки без возможности вернуть
      - name: Measure raw BEFORE UPLOAD
        run: |
          python - <<'PY'
          import sys, os; sys.path.insert(0,'.')
          from polylab.data.integrity import raw_rows
          day = os.environ["DAY"]
          n, _, _ = raw_rows(day)
          expect = int(open("/tmp/raw_before_upload.txt").read() or 0)
          print(f"::notice::RAW ПЕРЕД ВЫГРУЗКОЙ: {n} строк (ожидалось {expect})")
          if n != expect:
              print("::error::raw изменился между дозаписью и выгрузкой")
              raise SystemExit(1)
          PY
        env:
          DAY: ${{ steps.day.outputs.d }}

      - name: Upload raw of the day
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ steps.day.outputs.d }}
          path: data/raw
          retention-days: 90
          overwrite: true

      - name: Upload run report
        uses: actions/upload-artifact@v4
        with:
          name: collector-run
          path: research/COLLECTOR_RUN.json
          retention-days: 30
          overwrite: true

      - name: Commit aggregates only
        run: |
          git config user.name "polylab"
          git config user.email "polylab@users.noreply.github.com"
          git add -A data docs/data research/COLLECTOR_RUN.json
          git commit -m "aggregates $(date -u +'%Y-%m-%d %H:%M')" || echo "нет изменений"
          git pull --rebase && git push
