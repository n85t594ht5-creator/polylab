name: POLYLAB probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe data sources
        run: python polylab/data/probe.py
      - name: Commit availability report
        run: |
          git config user.name "polylab"
          git config user.email "polylab@users.noreply.github.com"
          git add research/DATA_AVAILABILITY.json
          git commit -m "probe: real data availability" || echo "без изменений"
          git pull --rebase && git push
