name: POLYLAB backtest

on:
  workflow_dispatch:
    inputs:
      oos_fraction:
        description: "Доля out-of-sample"
        default: "0.30"
  schedule:
    - cron: "40 6 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: polylab-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests

      # raw живёт в артефактах (решение 5C). Для бэктеста собираем все доступные дни.
      - name: Restore all raw artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: raw-*
          merge-multiple: true
          path: data/raw

      - name: Report dataset
        run: |
          echo "файлы raw:"; ls -la data/raw/dna 2>/dev/null || echo "  raw не восстановлен"

      - name: Run backtest
        env:
          OOS_FRACTION: ${{ github.event.inputs.oos_fraction || '0.30' }}
        run: python polylab/backtest/run.py

      - name: Publish to dashboard
        run: python polylab/data/publish.py

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: data/backtest
          retention-days: 90
          overwrite: true

      - name: Commit results
        run: |
          git config user.name "polylab"
          git config user.email "polylab@users.noreply.github.com"
          git add -A research docs/data
          git commit -m "backtest $(date -u +'%Y-%m-%d %H:%M')" || echo "нет изменений"
          git pull --rebase && git push
