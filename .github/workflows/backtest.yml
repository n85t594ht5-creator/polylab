name: POLYLAB backtest

on:
  workflow_dispatch:
    inputs:
      oos_fraction:
        description: "Доля out-of-sample"
        default: "0.30"
  schedule:
    - cron: "40 6 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: polylab-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests

      # raw живёт в артефактах (решение 5C), но download-artifact видит только
      # артефакты СВОЕГО прогона. Поэтому качаем через API все raw-* из репозитория.
      - name: Restore all raw artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/raw
          python - <<'PY'
          import json, os, subprocess, zipfile, io, urllib.request
          tok = os.environ["GH_TOKEN"]; repo = os.environ["GITHUB_REPOSITORY"]
          def api(url):
              r = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}",
                                                       "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(r))
          arts = api(f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100")["artifacts"]
          raw = [a for a in arts if a["name"].startswith("raw-") and not a["expired"]]
          print(f"найдено артефактов raw: {len(raw)}")
          got = 0
          for a in raw:
              req = urllib.request.Request(a["archive_download_url"],
                                           headers={"Authorization": f"Bearer {tok}"})
              try:
                  data = urllib.request.urlopen(req).read()
                  zipfile.ZipFile(io.BytesIO(data)).extractall("data/raw")
                  got += 1
                  print(f"  {a['name']}: {a['size_in_bytes']} Б")
              except Exception as e:
                  print(f"  {a['name']}: ошибка — {e}")
          print(f"восстановлено артефактов: {got}")
          PY

      - name: Report dataset
        run: |
          echo "файлы raw:"; ls -la data/raw/dna 2>/dev/null || echo "  raw не восстановлен"

      - name: Run backtest
        env:
          OOS_FRACTION: ${{ github.event.inputs.oos_fraction || '0.30' }}
        run: python polylab/backtest/run.py

      - name: Publish to dashboard
        run: python polylab/data/publish.py

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: data/backtest
          retention-days: 90
          overwrite: true

      - name: Commit results
        run: |
          git config user.name "polylab"
          git config user.email "polylab@users.noreply.github.com"
          git add -A research docs/data
          git commit -m "backtest $(date -u +'%Y-%m-%d %H:%M')" || echo "нет изменений"
          git pull --rebase && git push
