name: POLYLAB backtest

on:
  workflow_dispatch:
    inputs:
      oos_fraction:
        description: "Доля out-of-sample"
        default: "0.30"
  schedule:
    - cron: "40 6 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: polylab-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests

      # raw живёт в артефактах (5C), а download-artifact видит только свой прогон.
      # Берём последний артефакт raw-<день> для каждого дня через gh CLI.
      - name: Restore all raw artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/raw
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name|startswith("raw-")) | select(.expired==false) | [.name, .workflow_run.id, .created_at] | @tsv' \
            | sort -k1,1 -k3,3r | awk '!seen[$1]++' > /tmp/arts.tsv
          echo "дней с артефактами: $(wc -l < /tmp/arts.tsv)"
          cat /tmp/arts.tsv
          while IFS=$'\t' read -r NAME RUN_ID CREATED; do
            echo "качаю $NAME (прогон $RUN_ID)"
            gh run download "$RUN_ID" -n "$NAME" -D data/raw --repo "$GITHUB_REPOSITORY" \
              || echo "  не удалось: $NAME"
          done < /tmp/arts.tsv
          echo "содержимое data/raw:"; find data/raw -type f | head -20
          COUNT=$(find data/raw/dna -name '*.csv.gz' 2>/dev/null | wc -l)
          echo "восстановлено файлов DNA: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::raw не восстановлен — бэктест не на чем запускать"
            exit 1
          fi

      - name: Report dataset
        run: |
          echo "файлы raw:"; ls -la data/raw/dna 2>/dev/null || echo "  raw не восстановлен"

      - name: Run backtest
        env:
          OOS_FRACTION: ${{ github.event.inputs.oos_fraction || '0.30' }}
        run: python polylab/backtest/run.py

      - name: Publish to dashboard
        run: python polylab/data/publish.py

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: data/backtest
          retention-days: 90
          overwrite: true

      - name: Commit results
        run: |
          git config user.name "polylab"
          git config user.email "polylab@users.noreply.github.com"
          git add -A research docs/data
          git commit -m "backtest $(date -u +'%Y-%m-%d %H:%M')" || echo "нет изменений"
          git pull --rebase && git push
